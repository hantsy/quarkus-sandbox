version: 2
updates:
  # Every sample is a standalone Maven project with its own pom.xml, so each
  # module directory is registered explicitly. `legacy/` is deliberately absent:
  # those samples stay pinned to older APIs and are never part of an upgrade sweep.
  - package-ecosystem: maven
    directories:
      - /amqp
      - /amqp-rabbitmq
      - /data-hibernate
      - /graphql
      - /graphql-client
      - /jms
      - /kafka
      - /mongodb-kotlin
      - /mongodb-kotlin-co
      - /multipart
      - /pulsar
      - /quartz
      - /rabbitmq
      - /rest
      - /rest-classic
      - /rest-hibernate
      - /rest-kotlin-co
      - /rest-pgclient
      - /restclient
      - /restclient-classic
      - /restclient-classic-java11
      - /restclient-classic-jaxrs
      - /restclient-classic-kotlin
      - /restclient-classic-vertx
      - /restclient-kotlin-co
      - /spring
      - /vertx-routes
    schedule:
      interval: weekly
      day: sunday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 25
    ignore:
      # graphql-client stubs GraphQL documents with wiremock-graphql-extension,
      # which writes matcher metadata that became immutable in the 4.x line
      # (UnsupportedOperationException: Metadata is immutable). Revisit once the
      # extension ships a compatible release.
      - dependency-name: org.wiremock:*
        versions: [">= 4.0.0"]
    groups:
      # Both the Maven plugins and the wrapper distribution (read from every
      # module's .mvn/wrapper/maven-wrapper.properties) are versioned together,
      # so one PR per bump instead of one per module directory.
      maven:
        patterns:
          - org.apache.maven:*
          - org.apache.maven.plugins:*
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
          - org.jetbrains.kotlinx:*
      quarkus-platform:
        patterns:
          - io.quarkus*
          - io.quarkiverse*
      # Third-party libraries each module pins itself, so a single upstream
      # release otherwise fans out into one PR per declaring module. Artifacts
      # left to the Quarkus BOM (io.rest-assured:*, io.smallrye.*) have no
      # version here for Dependabot to bump; they move with quarkus-platform.
      shared-libraries:
        patterns:
          - org.assertj:*
          - org.awaitility:*
          - org.mockito:*
          - org.mockito.kotlin:*
          - io.mockk:*
          - io.kotest:*
          - org.wiremock:*
          - io.github.nilwurtz:*
          - com.squareup.okhttp3:*
          - org.projectlombok:*

  # Actions themselves: checkout, setup-java, and the Pages build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "03:00"
      timezone: Asia/Shanghai
