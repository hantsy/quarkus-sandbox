# Configures the AMQP broker credentials.
#amqp-username=quarkus
#amqp-password=quarkus
#amqp-host=localhost
#amqp-port=5672

# AMQP RabbitMQ support, see:
# https://smallrye.io/smallrye-reactive-messaging/latest/amqp/rabbitmq/
# RabbitMQ 4.0+ only accepts the v2 address format (/queues/, /exchanges/);
# a bare address is rejected with amqp_address_v1_not_permitted.
mp.messaging.outgoing.send.connector=smallrye-amqp
mp.messaging.outgoing.send.address=/queues/messages
mp.messaging.outgoing.send.use-anonymous-sender=false

mp.messaging.incoming.messages.connector=smallrye-amqp
mp.messaging.incoming.messages.address=/queues/messages
mp.messaging.incoming.messages.durable=false

# RabbitMQTestResource starts the broker for the tests. The AMQP dev service is
# built around arkmq-org/arkmq-org-broker (ActiveMQ Artemis), so enabling it here
# boots a second, redundant RabbitMQ container.
%test.quarkus.amqp.devservices.enabled=false

# see: https://quarkus.io/guides/amqp-dev-services
# see: https://github.com/quarkusio/quarkus/discussions/34937#discussioncomment-6552504
